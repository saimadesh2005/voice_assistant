<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant - Chitti</title>
    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
    <script src="D:\voice assistant\app.py"></script>
    <style>
        :root {
            --primary: #4fc3f7;
            --secondary: #a5d6a7;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }
        
        #log {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .entry {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        
        .user {
            background: rgba(79, 195, 247, 0.1);
            border-left: 4px solid var(--primary);
        }
        
        .bot {
            background: rgba(165, 214, 167, 0.1);
            border-left: 4px solid var(--secondary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Microphone button styling */
        #micBtn {
            display: block;
            margin: 20px auto;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #micBtn:hover {
            background: #3da8d8;
            transform: scale(1.05);
        }
        
        #micBtn.listening {
            background: #f44336;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Chitti - Your Voice Assistant</h1>
        
        <div id="log"></div>
        
        <button id="micBtn">🎤 Start Listening</button>
    </div>

    <script>
        const socket = io();
        const log = document.getElementById("log");
        const micBtn = document.getElementById("micBtn");
        let isListening = false;

        // Add message to log
        function addMessage(text, cls, icon = '') {
            const div = document.createElement("div");
            div.className = `entry ${cls}`;
            
            if (icon) {
                const iconSpan = document.createElement("span");
                iconSpan.textContent = icon + " ";
                iconSpan.style.marginRight = "8px";
                div.appendChild(iconSpan);
            }
            
            const textNode = document.createTextNode(text);
            div.appendChild(textNode);
            
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        // Socket event handlers
        socket.on("connect", () => {
            addMessage("Connected to server", "bot", "🔗");
        });

        socket.on("user_speech", msg => {
            addMessage(msg, "user", "👤 You:");
        });

        socket.on("bot_response", msg => {
            addMessage(msg, "bot", "🤖 Chitti:");
        });

        socket.on("transcription", data => {
            const result = JSON.parse(data);
            if (result.text) {
                addMessage(result.text, "user", "👤 You:");
            }
        });

        // Microphone button handler
        micBtn.addEventListener("click", () => {
            isListening = !isListening;
            
            if (isListening) {
                micBtn.classList.add("listening");
                micBtn.textContent = "🔴 Stop Listening";
                socket.emit("start_listening");
                addMessage("Listening...", "bot", "👂");
            } else {
                micBtn.classList.remove("listening");
                micBtn.textContent = "🎤 Start Listening";
                socket.emit("stop_listening");
                addMessage("Stopped listening", "bot", "✋");
            }
        });
    </script>
</body>
</html>
